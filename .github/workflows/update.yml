name: Update data and deploy

on:
  schedule:
    # GitHub 的定時排程常被延後或跳過（實測每 4–8 小時才跑一次），所以每小時排兩個時間點提高命中率
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force_ai:
        description: "這次強制執行 AI 註解"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["index.html", "assets/**", "pipeline/**", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # AI 時段要抓內文、寫報告，約多 3–6 分鐘
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 資料放在獨立的 data 分支（永遠只有一個 commit），main 只放程式碼，避免 repo 歷史膨脹
      - name: Restore data branch
        run: |
          rm -rf data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "$REMOTE" data
            rm -rf data/.git
          else
            mkdir data
          fi

      - name: Fetch, analyze, annotate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_MODEL_WRITER: ${{ vars.AI_MODEL_WRITER }}
          AI_DEEP: ${{ vars.AI_DEEP }}
          AI_HOURS: ${{ vars.AI_HOURS }}
        run: |
          python pipeline/run.py ${{ inputs.force_ai && '--force-ai' || '' }}

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r index.html assets _site/
          cp -r data/daily data/index.json data/health.json _site/data/
          touch _site/.nojekyll

      # 兩個分支都用「單一 commit 強制推送」：data 存資料，gh-pages 是 GitHub Pages 實際提供的網站
      - name: Publish data and gh-pages branches
        run: |
          publish() {
            cd "$1"
            git init -q -b "$2"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "$2: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push -q -f "$REMOTE" "$2"
            cd "$GITHUB_WORKSPACE"
          }
          publish data data
          publish _site gh-pages
