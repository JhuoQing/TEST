name: Update data and deploy

on:
  schedule:
    - cron: "7 * * * *"   # 每小時第 7 分鐘（UTC），RSS 只留最新幾十則，需要多次累積
  workflow_dispatch:
    inputs:
      force_ai:
        description: "這次強制執行 AI 註解"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["index.html", "assets/**", "pipeline/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 資料放在獨立的 data 分支（永遠只有一個 commit），main 只放程式碼，避免 repo 歷史膨脹
      - name: Restore data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          else
            mkdir data
          fi

      - name: Fetch, analyze, annotate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_EVERY_HOURS: ${{ vars.AI_EVERY_HOURS }}
        run: |
          [ -n "$AI_MODEL" ] || unset AI_MODEL
          [ -n "$AI_EVERY_HOURS" ] || unset AI_EVERY_HOURS
          python pipeline/run.py ${{ inputs.force_ai && '--force-ai' || '' }}

      - name: Save data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r index.html assets _site/
          cp -r data/daily data/index.json data/health.json _site/data/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
